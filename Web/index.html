<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Byers Wall</title>

  <!-- Google Fonts: Stranger Things–style -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #e50914;
      --black: #0b0b0b;
      --grey: #1a1a1a;
    }

    body {
      margin: 0;
      background-color: var(--black);
      color: white;
      font-family: 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.8rem;
      color: var(--red);
      text-shadow: 0 0 10px var(--red);
      margin-bottom: 1rem;
      text-align: center;
    }

    p {
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
      font-size: 1.1rem;
      color: #ddd;
    }

    .button {
      background-color: var(--red);
      border: none;
      color: white;
      font-weight: bold;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1.2rem;
      margin-top: 2rem;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
      transition: all 0.2s ease;
    }

    .button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.8);
      cursor: pointer;
    }

    footer {
      margin-top: auto;
      font-size: 0.9rem;
      color: #888;
      text-align: center;
      padding: 2rem 0 0 0;
    }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }
      p {
        font-size: 1rem;
      }
      .button {
        width: 90%;
        padding: 1rem;
      }
    }
  </style>
</head>

<body>
  <h1>Byers Wall</h1>

  <p>
    Welcome to the Byers Wall — an interactive light installation inspired by
    <em>Stranger Things</em> and powered by ESP32 microcontrollers, sensors, and MQTT magic.
  </p>

  <button class="button" onclick="alert('Light sequence trigger coming soon!')">
    Trigger a Light Sequence
  </button>

  <footer>
    © 2025 Byers Wall Project · Sydney / Los Angeles
  </footer>
</body>
</html>
